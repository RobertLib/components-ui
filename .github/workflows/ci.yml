name: CI

# Only main - releases are prepared on development and checked when they
# reach main
on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `prepare` builds the library on install
      - run: npm ci
      # TypeScript 5 for the source copy to typecheck with too - outside the
      # project, where its `tsc` would replace the one of the project
      - run: npm install --prefix "$RUNNER_TEMP/typescript-5" typescript@5.9
      - run: npm run check
        env:
          SOURCE_COPY_TYPESCRIPT: ${{ runner.temp }}/typescript-5/node_modules/typescript
      # TZ-dependent tests must keep process workers when threads are requested
      - run: npm test -- --project=timezones --pool=threads
      - run: npm run build:docs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The sync renames in case where the file system ignores case - macOS and
  # Windows. Its tests skip that on Linux, and Windows has junctions of its
  # own. The Vite plugin goes by the paths of the modules - in other case on
  # macOS and Windows, with drive letters and the short names of the
  # temporary folder (RUNNER~1) on Windows - and the package test packs and
  # installs the build with the tools of each system
  sync-source:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `prepare` builds the library on install - the package of the test
      - run: npm ci
      - run: node --test scripts/test-sync-source.mjs scripts/test-vite-plugin.mjs scripts/test-package.mjs

  # The oldest Node of `engines` - an install from git builds the package
  # with it (`prepare`). The other tests need a newer one (`devEngines`)
  oldest-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-package.mjs
