name: CI

# The development branch too - releases are prepared there before they reach
# main, so its pushes are checked even without a pull request
on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `prepare` builds the library on install
      - run: npm ci
      - run: npm run check
      - run: npm run build:docs
