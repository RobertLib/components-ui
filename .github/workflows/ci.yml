name: CI

# The development branch too - releases are prepared there before they reach
# main, so its pushes are checked even without a pull request
on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `prepare` builds the library on install
      - run: npm ci
      - run: npm run check
      # TZ-dependent tests must keep process workers when threads are requested
      - run: npm test -- --project=timezones --pool=threads
      - run: npm run build:docs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The sync renames in case where the file system ignores case - macOS and
  # Windows. Its tests skip that on Linux, and Windows has junctions of its own
  sync-source:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No install - the tests of the sync need Node and Git alone. Those of
      # the export build an app with Vite, which the job on Linux runs
      - run: node --test scripts/test-sync-source.mjs
