<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Documentation and live examples of the components-ui React component library."
    />
    <title>components-ui</title>
    <!-- The script of getColorSchemeScript(), formatted: applies the color
         scheme remembered by useColorScheme before the first paint -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("color-scheme");
        } catch (e) {}
        if (s !== "light" && s !== "dark" && s !== "system") s = "system";
        try {
          var d =
              s === "dark" ||
              (s === "system" &&
                matchMedia("(prefers-color-scheme: dark)").matches),
            r = document.documentElement;
          r.classList.toggle("dark", d);
          r.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/docs/main.tsx"></script>
  </body>
</html>
