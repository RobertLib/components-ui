<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Documentation and live examples of the components-ui React component library."
    />
    <title>components-ui</title>
    <script>
      // Apply the saved color theme before the first paint
      try {
        const theme = localStorage.getItem("docs-theme") || "system";
        const dark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/docs/main.tsx"></script>
  </body>
</html>
